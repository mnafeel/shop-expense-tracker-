name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_BASE: /shop-expense-tracker-/
          VITE_FIREBASE_API_KEY: AIzaSyAK2TVO6irJQdZWpA4htpGM078v8_UagMM
          VITE_FIREBASE_AUTH_DOMAIN: shop-expense-tracker-cf6ae.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: shop-expense-tracker-cf6ae
          VITE_FIREBASE_STORAGE_BUCKET: shop-expense-tracker-cf6ae.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: "155241406929"
          VITE_FIREBASE_APP_ID: 1:155241406929:web:c9880fde1a9c89e9ff80f0

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
